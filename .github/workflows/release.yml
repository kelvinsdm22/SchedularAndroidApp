name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # When the signing secrets are not configured yet, every step below is
    # skipped and the job simply passes green instead of failing loudly.
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Signing secrets missing – nothing to do
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "KEYSTORE_BASE64 secret is not set – skipping the release build."
          echo "Add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
          echo "under Settings > Secrets and variables > Actions, then re-run."

      - name: Check out
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/checkout@v4

      - name: Resolve version
        if: env.HAS_KEYSTORE == 'true'
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        if: env.HAS_KEYSTORE == 'true'
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        if: env.HAS_KEYSTORE == 'true'
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > scheduler-release.jks

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_FILE: scheduler-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.v.outputs.version }}
          VERSION_CODE: ${{ steps.v.outputs.code }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Stage APK with a stable name
        if: env.HAS_KEYSTORE == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk scheduler-app.apk

      - name: Clean up keystore
        if: always()
        run: rm -f scheduler-release.jks

      - name: Publish GitHub Release
        if: env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Scheduler ${{ steps.v.outputs.version }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', steps.v.outputs.version) || github.ref_name }}
          generate_release_notes: true
          files: scheduler-app.apk
